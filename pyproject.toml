[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "board-extractor"
version = "1.0.0"
description = "Card records in, the Board Generator's board file and card file out."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
board-extractor = "board_extractor.cli:main"

[tool.setuptools]
packages = ["board_extractor"]
